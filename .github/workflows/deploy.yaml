name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - run: bun install --frozen-lockfile
      - run: bun run fmt --check
      - run: bun test

      - name: Link Vercel project
        run: bunx --bun vercel link --project=${{ vars.VERCEL_PROJECT_ID }} --scope=${{ vars.VERCEL_ORG_ID }} --token=${{ secrets.VERCEL_TOKEN }} --yes

      - name: Pull Vercel environment
        run: bunx --bun vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: bunx --bun vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # stdout is the deployment URL; progress and errors go to stderr.
      - name: Deploy
        run: |
          url=$(bunx --bun vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          [ -n "$url" ] || { echo 'vercel deploy printed no deployment URL' >&2; exit 1; }
          echo "deployed $url" >> "$GITHUB_STEP_SUMMARY"
