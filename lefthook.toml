[pre-commit.commands.oxfmt]
# every type the CI fmt check gates, so none passes the commit and fails CI
glob = "*.{css,html,js,json,md,toml,ts,yaml,yml}"
# --no-error-on-unmatched-pattern: a commit touching only oxfmt-ignored files
# (public/ui.css) would otherwise exit 2 ("Expected at least one target file").
run = "bunx --bun oxfmt --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-push.commands.test]
run = "bun test"
